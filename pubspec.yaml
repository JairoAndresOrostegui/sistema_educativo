name: sistema_educativo
description: "Sistema educativo multiplataforma para colegios."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  image_picker: ^1.0.4
  permission_handler: ^12.0.1
  google_maps_flutter: ^2.12.3
  geocoding: ^4.0.0
  geolocator: ^12.0.0
  cloud_functions: ^4.6.5
  http: ^1.4.0
  flutter_typeahead: ^4.3.8
  collection: ^1.18.0
  flutter_svg: ^2.0.7
  intl: ^0.18.1
  flutter:
    sdk: flutter

  # Firebase y servicios esenciales
  firebase_core: ^2.31.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.7.0

  # Manejo de estado y arquitectura
  provider: ^6.1.2

  # Notificaciones
  firebase_messaging: ^14.7.11
  flutter_local_notifications: ^17.1.2

  # Íconos iOS
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/favicon.png"