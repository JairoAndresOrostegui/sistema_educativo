name: sistema_educativo
description: "Sistema educativo multiplataforma para colegios."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  url_launcher: 6.3.2
  # Versiones estables compatibles con file_picker 11 (win32 5.x).
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.1
  # 3.13 requiere xml 7, incompatible con excel 4.x (xml <7).
  pdf: ^3.12.0
  excel: ^4.0.6
  # 5.15 hereda la misma incompatibilidad xml entre pdf 3.13 y excel 4.x.
  printing: ^5.14.3
  open_filex: ^4.3.3
  path_provider: ^2.1.6
  universal_html: ^2.2.4
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  permission_handler: ^13.0.0
  google_maps_flutter: ^2.18.0
  geocoding: ^5.0.0
  # 14.0.3 fuerza package_info_plus 10 y rompe file_picker estable.
  geolocator: ^14.0.2
  cloud_functions: ^6.3.6
  http: ^1.4.0
  flutter_typeahead: ^6.0.0
  collection: ^1.18.0
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  google_fonts: ^8.2.1

  # Firebase y servicios esenciales
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6

  # Manejo de estado y arquitectura
  provider: ^6.1.2

  # Navegacion declarativa
  go_router: ^17.4.0

  # Notificaciones
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0

  # Íconos iOS
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/Logo.jpeg
    - assets/logo_fondo.png
    - assets/pagina_inicio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/favicon.png"
                              
